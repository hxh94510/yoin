<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeeee6">
  <meta name="description" content="余音 YOIN：老田的嫡系们群聊角色图鉴。探索 11 种对话原型、角色羁绊，并用 10 道场景对话发现你的聊天风格。">
  <title>余音 YOIN — 每句话，都有你的形状</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="audio.css">
  <script defer src="data.js"></script>
  <script defer src="tests.js"></script>
  <script defer src="vendor/cuelume/cuelume.js"></script>
  <script defer src="audio.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳转到内容</a>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="余音 YOIN 首页"><span class="brand-mark">y.</span><span>余音<span class="brand-sub">YOIN / CHAT CULTURE CLUB</span></span></a>
    <nav class="nav" aria-label="主导航">
      <a href="#home" data-nav="home">发现 <span>01</span></a>
      <a href="#characters" data-nav="characters">角色图鉴 <span>02</span></a>
      <a href="#relations" data-nav="relations">羁绊网络 <span>03</span></a>
      <a href="#tests" data-nav="tests">测试实验室 <span>04</span></a>
    </nav>
    <a class="header-cta" href="#quiz/chat-dna">找到你的同频 ↗</a>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="site-footer"><a class="footer-logo" href="#home">余音 YOIN<span>会话は、つづく。</span></a><p>老田的嫡系们 · 聊天文化观察计划<br>2023.02 — 2026.09 / VOL. 001</p><a href="#about">数据与设计说明 ↗</a></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <aside class="sound-dock" aria-label="音乐与音效">
    <section id="sound-panel" class="sound-panel" aria-labelledby="sound-panel-title" hidden>
      <div class="sound-panel-heading"><span id="sound-panel-title">声音，也有你的节奏。</span><button id="sound-panel-close" type="button" aria-label="关闭音频设置">×</button></div>
      <div class="sound-track"><span class="sound-track-icon" aria-hidden="true">♫</span><div><b>軽快なリズム</b><small>BACKGROUND MUSIC / LOOP</small></div></div>
      <div class="sound-slider-label"><label for="bgm-volume">背景音乐</label><output id="bgm-volume-value" for="bgm-volume">20%</output></div>
      <input id="bgm-volume" class="sound-range" type="range" min="0" max="100" step="1" value="20" aria-label="背景音乐音量">
      <div class="sound-sfx-heading"><div><b>交互音效</b><small>选择、翻页与完成提示</small></div><button id="sfx-toggle" class="sound-switch" type="button" role="switch" aria-checked="true" aria-label="交互音效"><i aria-hidden="true"></i></button></div>
      <div class="sound-slider-label"><label for="sfx-volume">音效音量</label><output id="sfx-volume-value" for="sfx-volume">25%</output></div>
      <input id="sfx-volume" class="sound-range" type="range" min="0" max="100" step="1" value="25" aria-label="交互音效音量">
      <div class="sound-panel-footer"><button id="sfx-preview" type="button">试听一下 ↗</button><span>偏好保存在此浏览器</span></div>
    </section>
    <div class="sound-capsule">
      <button id="bgm-toggle" class="bgm-toggle" type="button" aria-label="播放背景音乐" aria-pressed="false" aria-describedby="bgm-status">
        <span class="sound-disc" aria-hidden="true"><i></i></span>
        <span class="sound-label"><b id="bgm-label">BGM READY</b><small id="bgm-status" role="status">音乐正在准备中</small></span>
        <span class="sound-equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>
      <button id="sound-settings" class="sound-settings" type="button" aria-label="音频设置" aria-expanded="false" aria-controls="sound-panel"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 4v16M12 4v16M18 4v16" stroke="currentColor" stroke-width="1.3"/><path d="M3 9h6M9 15h6M15 8h6" stroke="currentColor" stroke-width="3"/></svg></button>
    </div>
  </aside>
  <audio id="yoin-bgm" src="assets/audio/keikai-na-rhythm.mp3" preload="none" loop></audio>
  <noscript><p class="noscript">请启用 JavaScript，以浏览角色档案和完成测试。</p></noscript>
</body>
</html>
